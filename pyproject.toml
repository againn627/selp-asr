[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selp-asr"
version = "1.0.0"
description = "本地语音识别服务：OpenAI 兼容接口，Windows 一条命令，CPU 可用，中文准"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "againn627" }]
keywords = ["asr", "speech-to-text", "whisper", "qwen3-asr", "sherpa-onnx", "openai", "local", "offline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "sherpa-onnx==2.0.1",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# 只有麦克风录音测试才需要
mic = ["sounddevice>=0.4.6"]
dev = ["ruff>=0.6", "pytest>=8"]

[project.scripts]
selp-asr = "asr_server.__main__:main"

[project.urls]
Homepage = "https://github.com/againn627/selp-asr"
Issues = "https://github.com/againn627/selp-asr/issues"

[tool.setuptools]
packages = ["asr_server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
